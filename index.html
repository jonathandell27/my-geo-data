<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <title>מפת ערים</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS and JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet.PolylineMeasure CSS and JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.polylinemeasure/Leaflet.PolylineMeasure.css" />
  <script src="https://unpkg.com/leaflet.polylinemeasure/Leaflet.PolylineMeasure.js"></script>

  <!-- Leaflet Geocoder CSS and JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      width: 100%;
      height: 700px;
      position: relative;
      z-index: 1;
    }
    .error-message {
      background-color: #ffcccc;
      padding: 10px;
      border: 1px solid #ff0000;
      border-radius: 5px;
      font-size: 14px;
    }
    #legend, #polygon-legend {
      position: absolute;
      background: white;
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      z-index: 900;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      max-height: 300px;
      overflow-y: auto;
    }
    .legend-item, .polygon-legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }
    .legend-shape, .polygon-legend-shape {
      width: 20px;
      height: 20px;
      margin-right: 8px;
      display: inline-block;
      border: 1px dashed black;
    }
    .legend-shape.line {
      width: 40px;
      height: 3px;
    }
    .legend-shape.circle {
      border-radius: 50%;
    }
    .legend-title, .polygon-legend-title {
      font-weight: bold;
      margin-bottom: 8px;
    }
    .leaflet-control-geocoder {
      z-index: 1000;
      background: white;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      padding: 5px;
    }
    .layer-toggle {
      background: white;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      padding: 5px;
      font-family: Arial, sans-serif;
      font-size: 12px;
    }
  </style>
</head>
<body>
<div id="map"></div>

<script>
  // Initialize the map
  const map = L.map('map').setView([31.9, 34.88], 10);

  // Create custom panes for layer ordering
  map.createPane('polygonsPane');
  map.getPane('polygonsPane').style.zIndex = 400;
  map.createPane('linesPane');
  map.getPane('linesPane').style.zIndex = 450;
  map.createPane('pointsPane');
  map.getPane('pointsPane').style.zIndex = 500;

  // Add base layers
  const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
  });
  const googleLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
    maxZoom: 20,
    subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
    attribution: '© Google Maps'
  });
  const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: '© Esri, Maxar, GeoEye, Earthstar Geographics'
  });
  const govmapLayer = L.tileLayer('https://cdnil.govmap.gov.il/xyz/heb/{z}/{x}/{y}.png', {
    attribution: '© Govmap Israel',
    maxZoom: 18
  });
  osmLayer.addTo(map); // Default base layer

  const baseLayers = {
    'OpenStreetMap': osmLayer,
    'Google Maps': googleLayer,
    'מפת לוויין': satelliteLayer,
    'Govmap': govmapLayer
  };
  L.control.layers(baseLayers, null, { position: 'topright' }).addTo(map);

  // Add PolylineMeasure control
  L.control.polylineMeasure({
    position: 'topleft',
    unit: 'metres',
    showBearings: false,
    clearMeasurementsOnStop: false,
    showClearControl: true,
    showUnitControl: false
  }).addTo(map);

  // Add Geocoder control
  L.Control.geocoder({
    defaultMarkGeocode: true,
    geocoder: L.Control.Geocoder.photon()
  }).addTo(map).on('markgeocode', function(e) {
    map.setView(e.geocode.center, 12);
  });

  // Function to get URL parameter
  function getURLParameter(name) {
    const params = new URLSearchParams(window.location.search);
    const value = params.get(name);
    if (name === 'yishuv_cd' && value && value !== 'ALL' && value !== '') {
      return value.split(',').map(Number).filter(n => !isNaN(n));
    }
    return value;
  }

  // Create a control for error messages
  const errorControl = L.control({ position: 'topright' });
  errorControl.onAdd = function (map) {
    this._div = L.DomUtil.create('div', 'error-message');
    this._div.style.display = 'none';
    return this._div;
  };
  errorControl.addTo(map);

  // Function to show error message
  function showError(message) {
    errorControl._div.innerHTML = message;
    errorControl._div.style.display = 'block';
  }

  // Function to hide error message
  function hideError() {
    errorControl._div.style.display = 'none';
  }

  // Create layer groups
  const serviceAreaLayer = L.layerGroup();
  const longPathLayer = L.layerGroup();
  const shortPathLayer = L.layerGroup();
  const stationsLayer = L.layerGroup();

  // Define colors for polygons
  const colors = [
    '#FFFF00', '#00FF00', '#FFA500', '#00CED1', '#FFD700', '#ADFF2F', '#1E90FF',
    '#FF69B4', '#32CD32', '#8A2BE2', '#FF4500', '#20B2AA', '#98FB98', '#6A5ACD',
    '#DC143C', '#2E8B57', '#CD5C5C'
  ];

  // Fetch and display GeoJSON data
  fetch('https://jonathandell27.github.io/my-geo-data/Station_Service.geojson')
    .then(response => response.json())
    .then(data => {
      const yishuvCdFilter = getURLParameter('yishuv_cd');
      const showAll = getURLParameter('showAll') === 'true';

      let filteredFeatures;
      if (showAll || yishuvCdFilter === 'ALL_VALUES' || yishuvCdFilter === '' || yishuvCdFilter == null) {
        filteredFeatures = data.features;
      } else {
        filteredFeatures = data.features.filter(feature =>
          yishuvCdFilter.includes(Number(feature.properties.yishuv_cd))
        );
      }

      console.log('Filtered features:', filteredFeatures.length, filteredFeatures);

      // Calculate unique stations and settlements
      const uniqueStationIds = [...new Set(filteredFeatures.map(f => f.properties.Stationid))];
      const uniqueSetlNames = [...new Set(filteredFeatures.map(f => f.properties.SETL_NAME))].filter(name => name != null && name !== '');
      const setlNameRank = {};
      uniqueSetlNames.forEach((name, index) => {
        setlNameRank[name] = index;
      });
      console.log('setlNames:', uniqueSetlNames, 'setlNameRank:', setlNameRank);

      // Add GeoJSON layer
      const geoJsonLayer = L.geoJSON(filteredFeatures, {
        onEachFeature: function (feature, layer) {
          const props = feature.properties;
          layer.bindPopup(
            `<b>מספר תחנה: ${props.Stationid || 'לא זמין'}</b><br>` +
            `יישוב משויך: ${props.yishuv_nm || 'לא זמין'}<br>` +
            `יישוב משורת: ${props.SETL_NAME || 'לא זמין'}<br>` +
            `אורך דרך ארוכה: ${Number(props.Longest).toFixed(2)}<br>` +
            `אורך דרך קצרה: ${Number(props.Shortest).toFixed(2)}`
          );

          const pathType = props.path;
          console.log('Feature path:', pathType, 'Geometry:', feature.geometry.type);
          if (feature.geometry.type === 'Polygon' && pathType === 'Service Area') {
            layer.options.pane = 'polygonsPane';
            layer.addTo(serviceAreaLayer);
          } else if ((feature.geometry.type === 'LineString' || feature.geometry.type === 'MultiLineString') && pathType === 'Short') {
            layer.options.pane = 'linesPane';
            layer.addTo(shortPathLayer);
          } else if ((feature.geometry.type === 'LineString' || feature.geometry.type === 'MultiLineString') && pathType === 'Long') {
            layer.options.pane = 'linesPane';
            layer.addTo(longPathLayer);
          }
        },
        style: function (feature) {
          const pathType = feature.properties.path;
          const setlName = feature.properties.SETL_NAME;
          if (feature.geometry.type === 'Polygon' && pathType === 'Service Area') {
            const rank = setlNameRank[setlName] || 0;
            const colorIndex = rank % colors.length;
            return {
              color: 'black',
              weight: 0,
              dashArray: '5, 5',
              fillColor: colors[colorIndex],
              fillOpacity: 0.8
            };
          } else if (feature.geometry.type === 'LineString' || feature.geometry.type === 'MultiLineString') {
            if (pathType === 'Short') {
              return {
                color: '#FF0000', // Red
                weight: 3,
                opacity: 1,
                dashArray: '5, 10'
              };
            } else if (pathType === 'Long') {
              return {
                color: '#0000FF', // Blue
                weight: 3,
                opacity: 1,
                dashArray: '5, 10'
              };
            }
            return {
              color: '#808080', // Gray
              weight: 3,
              opacity: 0.5,
              dashArray: '5, 10'
            };
          }
        }
      });

      // Create points layer
      filteredFeatures.forEach(feature => {
        const props = feature.properties;
        if (props.LatDifferrent != null && props.LongDifferrent != null && !isNaN(Number(props.LatDifferrent)) && !isNaN(Number(props.LongDifferrent))) {
          const lat = Number(props.LatDifferrent);
          const lon = Number(props.LongDifferrent);
          console.log('Creating point for Stationid:', props.Stationid, 'Lat:', lat, 'Lon:', lon);
          const pointLayer = L.circleMarker([lat, lon], {
            radius: 6,
            fillColor: '#800080', // Purple
            color: 'black',
            weight: 2,
            fillOpacity: 0.7,
            pane: 'pointsPane'
          }).bindPopup(
            `<b>מספר תחנה: ${props.Stationid || 'לא זמין'}</b><br>` +
            `יישוב משויך: ${props.yishuv_nm || 'לא זמין'}<br>` +
            `יישוב משורת: ${props.SETL_NAME || 'לא זמין'}<br>` +
            `אורך דרך ארוכה: ${Number(props.Longest).toFixed(2)}<br>` +
            `אורך דרך קצרה: ${Number(props.Shortest).toFixed(2)}`
          );
          pointLayer.addTo(stationsLayer);
        } else {
          console.warn('Invalid coordinates for Stationid:', props.Stationid, 'Lat:', props.LatDifferrent, 'Lon:', props.LongDifferrent);
        }
      });

      // Calculate bounds
      let bounds = L.latLngBounds();
      geoJsonLayer.eachLayer(layer => {
        if (layer instanceof L.Polygon || layer instanceof L.Polyline) {
          bounds.extend(layer.getBounds());
        }
      });
      stationsLayer.eachLayer(layer => {
        if (layer instanceof L.CircleMarker) {
          bounds.extend(layer.getLatLng());
        }
      });

      // Add layer groups to map
      serviceAreaLayer.addTo(map);
      longPathLayer.addTo(map);
      shortPathLayer.addTo(map);
      stationsLayer.addTo(map);

      // Add layer toggle control
      const layersToggle = L.control({ position: 'topright' });
      layersToggle.onAdd = function(map) {
        const div = L.DomUtil.create('div', 'layer-toggle');
        const checkboxes = [
          { layer: 'Service Area', text: 'אזור שירות' },
          { layer: 'Long', text: 'דרך ארוכה' },
          { layer: 'Short', text: 'דרך קצרה' },
          { layer: 'Stations', text: 'תחנות' }
        ];
        checkboxes.forEach(function(item) {
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = true;
          checkbox.onchange = function() {
            const layerGroup = {
              'Service Area': serviceAreaLayer,
              'Long': longPathLayer,
              'Short': shortPathLayer,
              'Stations': stationsLayer
            }[item.layer];
            if (this.checked) {
              if (!map.hasLayer(layerGroup)) {
                layerGroup.addTo(map);
              }
            } else {
              if (map.hasLayer(layerGroup)) {
                map.removeLayer(layerGroup);
              }
            }
          };
          const text = document.createTextNode(item.text);
          div.appendChild(checkbox);
          div.appendChild(text);
          div.appendChild(document.createElement('br'));
        });
        return div;
      };
      layersToggle.addTo(map);

      // Add main legend
      const legend = L.control({ position: 'bottomright' });
      legend.onAdd = function(map) {
        const div = L.DomUtil.create('div', 'legend');
        const title = document.createElement('div');
        title.className = 'legend-title';
        title.innerText = `מציג: ${uniqueStationIds.length} תחנות`;
        div.appendChild(title);
        const items = [
          { shape: 'rectangle', fillColor: 'transparent', opacity: 1, label: 'אזור שירות' },
          { shape: 'line', color: '#0000FF', weight: 3, label: 'דרך ארוכה' },
          { shape: 'line', color: '#FF0000', weight: 3, label: 'דרך קצרה' },
          { shape: 'circle', fillColor: '#800080', weight: 2, label: 'תחנות' }
        ];
        items.forEach(function(item) {
          const row = document.createElement('div');
          row.className = 'legend-item';
          const colorBox = document.createElement('span');
          colorBox.className = 'legend-shape';
          if (item.shape === 'circle') {
            colorBox.className += ' circle';
            colorBox.style.backgroundColor = item.fillColor;
            colorBox.style.border = `${item.weight}px solid black`;
          } else if (item.shape === 'line') {
            colorBox.className += ' line';
            colorBox.style.backgroundColor = item.color;
            colorBox.style.border = `${item.weight}px solid ${item.color}`;
          } else {
            colorBox.style.backgroundColor = item.fillColor;
            colorBox.style.opacity = item.opacity;
            colorBox.style.border = '1px dashed black';
          }
          const text = document.createTextNode(item.label);
          row.appendChild(colorBox);
          row.appendChild(text);
          div.appendChild(row);
        });
        return div;
      };
      legend.addTo(map);

      // Add polygon legend
      const polygonLegend = L.control({ position: 'bottomleft' });
      polygonLegend.onAdd = function(map) {
        const div = L.DomUtil.create('div', 'polygon-legend');
        const title = document.createElement('div');
        title.className = 'polygon-legend-title';
        title.innerText = 'אזורי שירות';
        div.appendChild(title);
        const note = document.createElement('div');
        note.innerText = 'מציג עד 10 יישובים';
        div.appendChild(note);
        if (uniqueSetlNames.length > 0) {
          uniqueSetlNames.slice(0, 10).forEach(function(setlName) {
            const rank = setlNameRank[setlName];
            const colorIndex = rank % colors.length;
            console.log('Polygon legend:', setlName, 'rank:', rank, 'color:', colors[colorIndex]);
            const row = document.createElement('div');
            row.className = 'polygon-legend-item';
            const colorBox = document.createElement('span');
            colorBox.className = 'polygon-legend-shape';
            colorBox.style.backgroundColor = colors[colorIndex];
            const text = document.createTextNode(setlName);
            row.appendChild(colorBox);
            row.appendChild(text);
            div.appendChild(row);
          });
        } else {
          div.innerHTML += '<div>אין יישובים זמינים</div>';
        }
        return div;
      };
      polygonLegend.addTo(map);

      // Focus on displayed features
      if (filteredFeatures.length > 0 && bounds.isValid()) {
        map.fitBounds(bounds, { padding: [50, 50] });
        console.log('Focusing on bounds:', bounds.toBBoxString());
        hideError();
      } else {
        console.warn('No features to display or invalid bounds');
        showError('לא נמצאו ישויות התואמות לקוד שהוזן');
        map.setView([31.9, 34.88], 10);
      }
    })
    .catch(error => {
      console.error('Error loading GeoJSON:', error);
      showError('שגיאה בטעינת נתוני GeoJSON');
      map.setView([31.9, 34.88], 10);
    });
</script>
</body>
</html>
