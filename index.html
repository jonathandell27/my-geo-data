<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <title>מפת ערים בישראל עם Leaflet.PolylineMeasure</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet.PolylineMeasure CSS + JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.polylinemeasure/Leaflet.PolylineMeasure.css" />
  <script src="https://unpkg.com/leaflet.polylinemeasure/Leaflet.PolylineMeasure.js"></script>

  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    .error-message {
      background-color: #ffcccc;
      padding: 10px;
      border: 1px solid #ff0000;
      border-radius: 5px;
      font-size: 14px;
    }
  </style>
</head>
<body>
<div id="map"></div>

<script>
  // Initialize the map
  const map = L.map('map').setView([31.7683, 35.2137], 8);

  // Add OpenStreetMap tiles
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  // Add PolylineMeasure control
  L.control.polylineMeasure({
    position: 'topleft',
    unit: 'metres',
    showBearings: true,
 pesclearMeasurementsOnStop: false,
    showClearControl: true,
    showUnitControl: true
  }).addTo(map);

  // Function to get URL parameter
  function getURLParameter(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  // Create a control for error messages
  const errorControl = L.control({ position: 'topright' });
  errorControl.onAdd = function (map) {
    this._div = L.DomUtil.create('div', 'error-message');
    this._div.style.display = 'none';
    return this._div;
  };
  errorControl.addTo(map);

  // Function to show error message
  function showError(message) {
    errorControl._div.innerHTML = message;
    errorControl._div.style.display = 'block';
  }

  // Function to hide error message
  function hideError() {
    errorControl._div.style.display = 'none';
  }

  // Fetch and display GeoJSON data
  fetch('https://jonathandell27.github.io/my-geo-data/israel_cities.geojson')
    .then(response => response.json())
    .then(data => {
      const citycodeFilter = getURLParameter('citycode');
      const showAll = getURLParameter('showAll') === 'true';

      // Filter features based on parameters
      let filteredFeatures;
      if (showAll || citycodeFilter === 'All' || citycodeFilter === '') {
        filteredFeatures = data.features;
      } else {
        filteredFeatures = data.features.filter(feature => feature.properties.citycode == citycodeFilter);
      }

      console.log('Filtered features:', filteredFeatures.length, filteredFeatures);

      // Check if there are features to display
      if (filteredFeatures.length > 0) {
        // Add GeoJSON layer for points and polygons
        const geoJsonLayer = L.geoJSON(filteredFeatures, {
          onEachFeature: function (feature, layer) {
            // Add popup with city name, citycode, and geometry type
            const geometryType = feature.geometry.type === 'Point' ? 'נקודה' : 'פוליגון';
            layer.bindPopup(
              `<b>${feature.properties.name}</b><br>` +
              `קוד עיר: ${feature.properties.citycode}<br>` +
              `סוג: ${geometryType}`
            );
          },
          pointToLayer: function (feature, latlng) {
            // Style for point markers
            return L.marker(latlng, {
              icon: L.icon({
                iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34]
              })
            });
          },
          style: function (feature) {
            // Style for polygons
            if (feature.geometry.type === 'Polygon') {
              return {
                color: '#3388ff',
                weight: 2,
                fillOpacity: 0.2
              };
            }
          }
        }).addTo(map);

        // Calculate bounds and focus on displayed features
        const bounds = geoJsonLayer.getBounds();
        if (bounds.isValid()) {
          map.fitBounds(bounds);
          console.log('Focusing on bounds:', bounds.toBBoxString());
          hideError();
        } else {
          console.warn('Invalid bounds, reverting to default view');
          showError('לא ניתן להתמקד בישויות - גבולות לא תקינים');
          map.setView([31.7683, 35.2137], 8);
        }
      } else {
        console.warn('No features to display for citycode:', citycodeFilter);
        showError('לא נמצאו ערים התואמות לקוד העיר שהוזן');
        map.setView([31.7683, 

35.2137], 8);
      }
    })
    .catch(error => {
      console.error('Error loading GeoJSON:', error);
      showError('שגיאה בטעינת נתוני GeoJSON');
      map.setView([31.7683, 35.2137], 8);
    });
</script>
</body>
</html>
