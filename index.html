<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <title>מפת ערים בישראל עם Leaflet.PolylineMeasure</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet.PolylineMeasure CSS + JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.polylinemeasure/Leaflet.PolylineMeasure.css" />
  <script src="https://unpkg.com/leaflet.polylinemeasure/Leaflet.PolylineMeasure.js"></script>

  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    .error-message {
      background-color: #ffcccc;
      padding: 10px;
      border: 1px solid #ff0000;
      border-radius: 5px;
      font-size: 14px;
    }
  </style>
</head>
<body>
<div id="map"></div>

<script>
  // Initialize the map
  const map = L.map('map').setView([31.7683, 35.2137], 8);

  // Add OpenStreetMap tiles
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  // Add PolylineMeasure control
  L.control.polylineMeasure({
    position: 'topleft',
    unit: 'metres',
    showBearings: true,
    clearMeasurementsOnStop: false,
    showClearControl: true,
    showUnitControl: true
  }).addTo(map);

  // Function to get URL parameter
  function getURLParameter(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  // Create a control for error messages
  const errorControl = L.control({ position: 'topright' });
  errorControl.onAdd = function (map) {
    this._div = L.DomUtil.create('div', 'error-message');
    this._div.style.display = 'none';
    return this._div;
  };
  errorControl.addTo(map);

  // Function to show error message
  function showError(message) {
    errorControl._div.innerHTML = message;
    errorControl._div.style.display = 'block';
  }

  // Function to hide error message
  function hideError() {
    errorControl._div.style.display = 'none';
  }

  // Create layer groups for israel_cities and servies_city
  const israelCitiesLayer = L.layerGroup();
  const serviesCityLayer = L.layerGroup();

  // Fetch and display GeoJSON data for israel_cities
  const israelCitiesPromise = fetch('https://jonathandell27.github.io/my-geo-data/israel_cities.geojson')
    .then(response => response.json())
    .then(data => {
      return { layerName: 'israel_cities', data };
    });

  // Fetch and display GeoJSON data for servies_city
  const serviesCityPromise = fetch('https://jonathandell27.github.io/my-geo-data/servies_city.geojson')
    .then(response => response.json())
    .then(data => {
      return { layerName: 'servies_city', data };
    });

  // Process both layers
  Promise.all([israelCitiesPromise, serviesCityPromise])
    .then(layers => {
      const citycodeFilter = getURLParameter('citycode');
      const showAll = getURLParameter('showAll') === 'true';

      let allFilteredFeatures = [];
      let bounds = L.latLngBounds();

      // Process each layer
      layers.forEach(({ layerName, data }) => {
        let filteredFeatures;
        if (showAll || citycodeFilter === 'All' || citycodeFilter === '') {
          filteredFeatures = data.features;
        } else {
          // Filter based on citycode for israel_cities or setl_code for servies_city
          filteredFeatures = data.features.filter(feature =>
            layerName === 'israel_cities'
              ? String(feature.properties.citycode) === String(citycodeFilter)
              : String(feature.properties.setl_code) === String(citycodeFilter)
          );
        }

        console.log(`Filtered features for ${layerName}:`, filteredFeatures.length, filteredFeatures);

        // Add GeoJSON layer
        const geoJsonLayer = L.geoJSON(filteredFeatures, {
          onEachFeature: function (feature, layer) {
            // Add popup with name, code, and geometry type
            const code = layerName === 'israel_cities' ? feature.properties.citycode : feature.properties.setl_code;
            const geometryType = feature.geometry.type === 'Point' ? 'נקודה' : 'פוליגון';
            layer.bindPopup(
              `<b>${feature.properties.name || 'לא זמין'}</b><br>` +
              `קוד: ${code}<br>` +
              `סוג: ${geometryType}`
            );
          },
          pointToLayer: function (feature, latlng) {
            // Style for point markers (for both layers)
            return L.marker(latlng, {
              icon: L.icon({
                iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34]
              })
            });
          },
          style: function (feature) {
            // Style for polygons
            if (feature.geometry.type === 'Polygon') {
              if (layerName === 'israel_cities') {
                return {
                  color: '#3388ff',
                  weight: 2,
                  fillOpacity: 0.2
                };
              } else if (layerName === 'servies_city') {
                return {
                  color: '#0000FF',
                  weight: 2,
                  fillOpacity: 0
                };
              }
            }
          }
        });

        // Add to appropriate layer group
        geoJsonLayer.addTo(layerName === 'israel_cities' ? israelCitiesLayer : serviesCityLayer);

        // Collect features and extend bounds
        allFilteredFeatures = allFilteredFeatures.concat(filteredFeatures);
        geoJsonLayer.eachLayer(layer => {
          if (layer instanceof L.Marker) {
            bounds.extend(layer.getLatLng());
          } else if (layer instanceof L.Polygon || layer instanceof L.Polyline) {
            bounds.extend(layer.getBounds());
          }
        });
      });

      // Add layer groups to map
      israelCitiesLayer.addTo(map);
      serviesCityLayer.addTo(map);

      // Add layer control
      const overlayLayers = {
        'ערים ונקודות (israel_cities)': israelCitiesLayer,
        'פוליגונים (servies_city)': serviesCityLayer
      };
      L.control.layers(null, overlayLayers, { position: 'topright' }).addTo(map);

      // Focus on displayed features
      if (allFilteredFeatures.length > 0 && bounds.isValid()) {
        map.fitBounds(bounds, { padding: [50, 50] });
        console.log('Focusing on bounds:', bounds.toBBoxString());
        hideError();
      } else {
        console.warn('No features to display or invalid bounds');
        showError('לא נמצאו ישויות התואמות לקוד שהוזן');
        map.setView([31.7683, 35.2137], 8);
      }
    })
    .catch(error => {
      console.error('Error loading GeoJSON:', error);
      showError('שגיאה בטעינת נתוני GeoJSON');
      map.setView([31.7683, 35.2137], 8);
    });
</script>
</body>
</html>
