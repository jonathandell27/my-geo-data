<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <title>מפת ערים בישראל עם Leaflet.PolylineMeasure</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet.PolylineMeasure CSS + JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.polylinemeasure/Leaflet.PolylineMeasure.css" />
  <script src="https://unpkg.com/leaflet.polylinemeasure/Leaflet.PolylineMeasure.js"></script>

  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    .error-message {
      background-color: #ffcccc;
      padding: 10px;
      border: 1px solid #ff0000;
      border-radius: 5px;
      font-size: 14px;
    }
    .legend {
      background-color: white;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 14px;
      line-height: 18px;
    }
    .legend i {
      width: 18px;
      height: 18px;
      float: right;
      margin-left: 8px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
<div id="map"></div>

<script>
  // Initialize the map
  const map = L.map('map').setView([31.7683, 35.2137], 8);

  // Add OpenStreetMap tiles
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  // Add PolylineMeasure control
  L.control.polylineMeasure({
    position: 'topleft',
    unit: 'metres',
    showBearings: true,
    clearMeasurementsOnStop: false,
    showClearControl: true,
    showUnitControl: true
  }).addTo(map);

  // Function to get URL parameter
  function getURLParameter(name) {
    const params = new URLSearchParams(window.location.search);
    const value = params.get(name);
    if (name === 'yishuv_cd' && value && value !== 'ALL' && value !== '') {
      return value.split(',').map(Number).filter(n => !isNaN(n));
    }
    return value;
  }

  // Create a control for error messages
  const errorControl = L.control({ position: 'topright' });
  errorControl.onAdd = function (map) {
    this._div = L.DomUtil.create('div', 'error-message');
    this._div.style.display = 'none';
    return this._div;
  };
  errorControl.addTo(map);

  // Function to show error message
  function showError(message) {
    errorControl._div.innerHTML = message;
    errorControl._div.style.display = 'block';
  }

  // Function to hide error message
  function hideError() {
    errorControl._div.style.display = 'none';
  }

  // Create layer groups for different feature types
  const serviceAreaLayer = L.layerGroup();
  const longPathLayer = L.layerGroup();
  const shortPathLayer = L.layerGroup();

  // Add legend control
  const legendControl = L.control({ position: 'bottomright' });
  legendControl.onAdd = function (map) {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML = `
      <div><i style="background: #FFFF00; opacity: 0.5;"></i> אזור שירות</div>
      <div><i style="background: #FF0000;"></i> דרך ארוכה</div>
      <div><i style="background: #0000FF;"></i> דרך קצרה</div>
    `;
    return div;
  };
  legendControl.addTo(map);

  // Fetch and display GeoJSON data for Station_Service
  fetch('https://jonathandell27.github.io/my-geo-data/Station_Service.geojson')
    .then(response => response.json())
    .then(data => {
      const yishuvCdFilter = getURLParameter('yishuv_cd');
      const showAll = getURLParameter('showAll') === 'true';

      let filteredFeatures;
      if (showAll || yishuvCdFilter === 'ALL_VALUES' || yishuvCdFilter === '' || yishuvCdFilter == null) {
        filteredFeatures = data.features;
      } else {
        filteredFeatures = data.features.filter(feature =>
          yishuvCdFilter.includes(Number(feature.properties.yishuv_cd))
        );
      }

      console.log('Filtered features for Station_Service:', filteredFeatures.length, filteredFeatures);

      // Add GeoJSON layer
      const geoJsonLayer = L.geoJSON(filteredFeatures, {
        onEachFeature: function (feature, layer) {
          // Add popup with specified properties
          const props = feature.properties;
          layer.bindPopup(
            `<b>מספר תחנה: ${props.Stationid || 'לא זמין'}</b><br>` +
            `יישוב משויך: ${props.yishuv_nm || 'לא זמין'}<br>` +
            `יישוב משורת: ${props.SETL_NAME || 'לא זמין'}<br>` +
            `אורך דרך ארוכה: ${Number(props.Longest).toFixed(2)}<br>` +
            `אורך דרך קצרה: ${Number(props.Shortest).toFixed(2)}`
          );

          // Add to appropriate layer group based on path and geometry
          const pathType = props.path;
          console.log('Feature path:', pathType, 'Geometry:', feature.geometry.type);
          if (feature.geometry.type === 'Polygon' && pathType === 'Service Area') {
            layer.addTo(serviceAreaLayer);
          } else if ((feature.geometry.type === 'LineString' || feature.geometry.type === 'MultiLineString') && pathType === 'Short') {
            layer.addTo(shortPathLayer);
          } else if ((feature.geometry.type === 'LineString' || feature.geometry.type === 'MultiLineString') && pathType === 'Long') {
            layer.addTo(longPathLayer);
          }
        },
        style: function (feature) {
          const pathType = feature.properties.path;
          if (feature.geometry.type === 'Polygon' && pathType === 'Service Area') {
            return {
              color: '#FFFF00', // Yellow
              weight: 2,
              fillOpacity: 0.5
            };
          } else if (feature.geometry.type === 'LineString' || feature.geometry.type === 'MultiLineString') {
            if (pathType === 'Short') {
              return {
                color: '#0000FF', // Blue
                weight: 3,
                opacity: 1
              };
            } else if (pathType === 'Long') {
              return {
                color: '#FF0000', // Red
                weight: 3,
                opacity: 1
              };
            }
            // Default style for unhandled LineString/MultiLineString cases
            return {
              color: '#808080', // Gray
              weight: 3,
              opacity: 0.5
            };
          }
        }
      });

      // Calculate bounds
      let bounds = L.latLngBounds();
      geoJsonLayer.eachLayer(layer => {
        if (layer instanceof L.Polygon || layer instanceof L.Polyline) {
          bounds.extend(layer.getBounds());
        }
      });

      // Add layer groups to map
      serviceAreaLayer.addTo(map);
      longPathLayer.addTo(map);
      shortPathLayer.addTo(map);

      // Add layer control
      const overlayLayers = {
        'אזור שירות': serviceAreaLayer,
        'דרך ארוכה': longPathLayer,
        'דרך קצרה': shortPathLayer
      };
      L.control.layers(null, overlayLayers, { position: 'topright' }).addTo(map);

      // Focus on displayed features
      if (filteredFeatures.length > 0 && bounds.isValid()) {
        map.fitBounds(bounds, { padding: [50, 50] });
        console.log('Focusing on bounds:', bounds.toBBoxString());
        hideError();
      } else {
        console.warn('No features to display or invalid bounds');
        showError('לא נמצאו ישויות התואמות לקוד שהוזן');
        map.setView([31.7683, 35.2137], 8);
      }
    })
    .catch(error => {
      console.error('Error loading GeoJSON:', error);
      showError('שגיאה בטעינת נתוני GeoJSON');
      map.setView([31.7683, 35.2137], 8);
    });
</script>
</body>
</html>
